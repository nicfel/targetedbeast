name: Operator validation

# Pass/fail gate for the operator-validation suites (the green/red badge in the README).
# It runs `ant validate-ci` (only the deterministic detailed-balance suites) purely for their
# JUnit result -- it does NOT render or commit any figures. The PNGs in validation/ are
# regenerated locally by a maintainer (`ant validate && Rscript validation/render.R`) and
# committed by hand.
#
# The slow, unseeded rate-prior suite (RatePriorMCMCTest) is intentionally NOT part of the gate:
# it is a single-chain statistical check that flaps at random, so it runs only locally.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'build.xml'
      - '.github/workflows/validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'build.xml'
      - '.github/workflows/validation.yml'
  workflow_dispatch: {}

# Only one validation run at a time per ref; a newer push cancels an in-flight (slow) run.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaFX SDK (needed to compile BeastFX)
        run: |
          set -euo pipefail
          JFX_VERSION=17.0.2
          curl -fsSL -o /tmp/javafx.zip \
            "https://download2.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_linux-x64_bin-sdk.zip"
          unzip -q /tmp/javafx.zip -d "$HOME"
          # build.xml globs ${env.JAVA_FX_HOME} for *.jar, so point it at the SDK's lib dir.
          echo "JAVA_FX_HOME=$HOME/javafx-sdk-${JFX_VERSION}/lib" >> "$GITHUB_ENV"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # Downloads beast2 + BeastFX master, compiles them + src + tests, then runs the deterministic
      # detailed-balance suites. Passes/fails on the JUnit assertions only; any files written are
      # discarded with the runner. Fast - the slow rate-prior suite is excluded (see build.xml).
      - name: Run detailed-balance suites (pass/fail)
        run: ant validate-ci
